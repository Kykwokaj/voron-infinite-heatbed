##########################################################
# Voron Infinite Heatbed - Moonraker Configuration
# install.sh writes a copy to ~/printer_data/config/ihb/infinite_heatbed.conf
# and includes it from moonraker.conf.
##########################################################

# Loads moonraker/infinite_heatbed_server.py (linked into Moonraker's
# components folder by install.sh): heat mats, eject settings, queue gating
# and the web UI at http://<printer>/ihb/
[infinite_heatbed_server]
# Look of the web UI: mainsail | fluidd   (install.sh sets this)
ui_theme: mainsail
# Folders of the web clients the UI is linked into (as <folder>/ihb)
#web_roots: ~/mainsail, ~/fluidd

# The queue must NOT start the next job on its own: the belt is still
# ejecting when a print finishes. infinite_heatbed_server starts it after
# the eject. If moonraker.conf already has [job_queue], set this there
# instead and delete this section.
[job_queue]
automatic_transition: False

[update_manager infinite_heatbed]
type: git_repo
path: ~/voron-infinite-heatbed
origin: https://github.com/Kykwokaj/voron-infinite-heatbed.git
primary_branch: main
managed_services: klipper moonraker
